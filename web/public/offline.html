<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Forest Guardian</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center;
        justify-content: center; text-align: center; padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #faf9f6; color: #1c2b22;
      }
      .card { max-width: 26rem; }
      .mark {
        width: 64px; height: 64px; border-radius: 16px; background: #2D5A3D;
        margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;
      }
      h1 { font-size: 1.4rem; margin: 0 0 8px; }
      p { color: #566; line-height: 1.5; margin: 0 0 20px; }
      a {
        display: inline-block; padding: 10px 18px; border-radius: 10px;
        background: #2D5A3D; color: #fff; text-decoration: none; font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #12160f; color: #eef2ea; }
        p { color: #9fb0a6; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 512 512">
          <path d="M96 372 L216 180 L300 300 L340 244 L416 372 Z" fill="#fff" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        This page hasn't been saved for offline use yet. Trails you've already
        opened, your saved plan, checklists and any downloaded trail guides are
        still available.
      </p>
      <a href="/trails">Back to trails</a>
    </div>
  </body>
</html>
