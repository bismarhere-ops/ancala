<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2D5A3D" />
  <meta name="description" content="Browse trails with distance, elevation, risk, and weather. Download guides for offline hiking." />
  <title>Trails · Forest Guardian</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 3 L27 22 H20 L16 29 L12 22 H5 Z" fill="currentColor"/>
          <circle cx="16" cy="15" r="2" fill="#F7F5F0"/>
        </svg>
        <span class="brand-text">Forest<br/>Guardian</span>
      </a>
      <nav class="main-nav" aria-label="Main">
        <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navMenu" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
        <ul class="nav-menu" id="navMenu">
          <li><a href="trails.html" aria-current="page">Trails</a></li>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="program.html">Program</a></li>
          <li><a href="community.html">Community</a></li>
          <li><a href="community.html#volunteer" class="btn btn-sm btn-primary">Join</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">Trail Information System</span>
        <h1>Find the right trail, prepared.</h1>
        <p class="lede">Distances, elevations, checkpoints, risk and live weather — all in one lightweight guide.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="filter-bar" role="search">
          <label class="field grow">
            <span class="sr-only">Search trail</span>
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" fill="none"/></svg>
            <input type="search" id="trailSearch" placeholder="Search by name or region" />
          </label>
          <label class="field">
            <span class="sr-only">Difficulty</span>
            <select id="filterDifficulty">
              <option value="">All difficulties</option>
              <option value="easy">Easy</option>
              <option value="moderate">Moderate</option>
              <option value="hard">Hard</option>
              <option value="expert">Expert</option>
            </select>
          </label>
          <label class="field">
            <span class="sr-only">Sort</span>
            <select id="sortBy">
              <option value="popular">Most popular</option>
              <option value="distance">Shortest first</option>
              <option value="elevation">Lowest elevation</option>
              <option value="time">Quickest</option>
            </select>
          </label>
        </div>

        <div class="trail-grid" id="trailGrid"></div>
      </div>
    </section>

    <!-- Trail detail modal -->
    <div class="modal" id="trailModal" role="dialog" aria-modal="true" aria-labelledby="trailModalTitle" hidden>
      <div class="modal-backdrop" data-close></div>
      <div class="modal-panel">
        <button class="modal-close" data-close aria-label="Close">×</button>
        <div id="trailModalBody"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-base slim">
      <a href="index.html" class="muted">← Back to home</a>
      <span class="status" id="netStatus">● Online</span>
    </div>
  </footer>

  <script src="js/trails-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/trails.js"></script>
</body>
</html>
