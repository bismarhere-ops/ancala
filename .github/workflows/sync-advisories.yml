name: Sync advisories

# Regenerates automatic advisories from their data sources and commits any
# change. One workflow (not two) owns advisories.json so runs never race.
#   - volcano: PVMBG alert levels  -> server/data/volcano-levels.json
#   - wildfire: satellite hotspots -> server/data/wildfire-hotspots.json
# Currently a no-op until those files carry real data (or their fetch steps are
# wired); the machinery runs daily so a change takes effect within a day.

on:
  schedule:
    - cron: '0 21 * * *' # 04:00 WIB (UTC+7), daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-advisories
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Both generators use only Node built-ins and repo files — no install.
      - name: Regenerate volcano advisories
        run: node server/jobs/sync-volcano-advisories.js

      - name: Regenerate wildfire advisories
        run: node server/jobs/sync-wildfire-advisories.js

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain server/data/advisories.json)" ]]; then
            git config user.name  "forest-guardian-bot"
            git config user.email "bot@users.noreply.github.com"
            git add server/data/advisories.json
            git commit -m "chore: sync advisories from live sources [skip ci]"
            git push
          else
            echo "No advisory change."
          fi
